name: CI quality gate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Unit tests + coverage (fail under 80%)
        run: pytest --cov=. --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=80

      - name: Integration - boot API and run API tests
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then echo "API is up"; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health
          BASE_URL=http://127.0.0.1:8000 pytest integration -v
          echo "--- server log ---"; cat server.log
